<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Nineteen stages. One missed approval stops all of them.</title>
  <desc id="desc">YaVaKa tracks the 19-stage Zimbabwe build sequence and flags statutory gates before they stall the build.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#07231f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#sky)"/><circle cx="944" cy="102" r="176" fill="#c8963e" opacity=".09"/><path d="M0 627c172-84 305-89 476-43s347 28 604-71v310H0Z" fill="#0b4035" opacity=".85"/><path d="M0 716c190-84 355-67 526-34s348 13 554-82v192H0Z" fill="#07231f"/><g fill="none" stroke="#d8b36d" stroke-opacity=".22"><path d="M-20 230c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/><path d="M-20 249c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/></g><circle cx="868" cy="520" r="300" fill="#c8963e" opacity=".07"/><rect x="72" y="62" width="54" height="54" rx="12.66" fill="#0F5D46"/><path d="M82.12 89.0 L99.0 74.66 L115.88 89.0" fill="none" stroke="#F7F4EF" stroke-width="3.54" stroke-linecap="round" stroke-linejoin="round"/><rect x="86.34" y="90.69" width="4.64" height="12.66" rx="2.02" fill="#C8963E"/><rect x="94.36" y="86.47" width="4.64" height="16.88" rx="2.02" fill="#E3B968"/><rect x="102.38" y="82.25" width="4.64" height="21.09" rx="2.02" fill="#C8963E"/><text x="142" y="100" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">YaVaKa</text><text x="144" y="124" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BUILD FROM ANYWHERE</text><rect x="74" y="157" width="374" height="42" rx="21.0" fill="#fffdf8" opacity="0.1"/><circle cx="99" cy="178.0" r="5" fill="#e2b967"/><text x="118" y="183.4" fill="#f3e6cb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">THE ZIMBABWE BUILD SEQUENCE</text><text x="66" y="500" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="236" font-weight="700" letter-spacing="-8">19</text><text x="76" y="578" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="1.4">STAGES · STAND TO HANDOVER</text><path d="M1080 330 H666 Q636 330 636 360 V592 Q636 622 666 622 H1080 Z" fill="#fffdf8" stroke="#c8963e" stroke-width="3.5"/><circle cx="692" cy="423.0" r="23" fill="#f2e6cd"/><g transform="translate(680 411.0)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="728" y="407.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL ACCOUNTABLE.</text><text x="728" y="429.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL TRACEABLE.</text><text x="728" y="451.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL SECURE.</text><text x="678" y="493.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Automated WhatsApp and email notifications.</text><text x="678" y="519.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Every receipt, invoice and document — at every</text><text x="678" y="545.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">stage — in your YaVaKa portal. Private to your</text><text x="678" y="571.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">build team and encrypted in transit.</text><text x="72" y="730" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="-1.404">One missed gate</text><text x="72" y="796.96" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="-1.404">stops the whole build.</text><text x="76" y="867.9200000000001" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Title, cession, council plans, EMA,</text><text x="76" y="897.9200000000001" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">ZINWA, ZESA, inspections. We map the</text><text x="76" y="927.9200000000001" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">sequence and call each gate early.</text><text x="76" y="967.9200000000001" fill="#e2b967" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">“Almost done” is not one of the nineteen stages.</text><rect x="72" y="1094" width="385" height="66" rx="18" fill="#c8963e"/><text x="102" y="1134.0" fill="#142f27" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">SEE THE FULL SEQUENCE</text><path d="M395 1127.0h25m-9-9 9 9-9 9" fill="none" stroke="#142f27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">APPROVALS, MAPPED IN ORDER.</text>
</svg>
