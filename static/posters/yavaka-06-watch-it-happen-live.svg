<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">You are not waiting for a report. You are watching it happen.</title>
  <desc id="desc">Every payment, receipt and stage update on a YaVaKa-managed build is logged live and visible anywhere in the world.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#07231f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#sky)"/><circle cx="944" cy="102" r="176" fill="#c8963e" opacity=".09"/><path d="M0 627c172-84 305-89 476-43s347 28 604-71v310H0Z" fill="#0b4035" opacity=".85"/><path d="M0 716c190-84 355-67 526-34s348 13 554-82v192H0Z" fill="#07231f"/><g fill="none" stroke="#d8b36d" stroke-opacity=".22"><path d="M-20 230c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/><path d="M-20 249c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/></g><rect x="72" y="62" width="54" height="54" rx="14" fill="#0f5d46"/><path d="m83 90 16-14 16 14" fill="none" stroke="#fffdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 92v13h22V92M94 105V94h9v11" fill="none" stroke="#c8963e" stroke-width="3" stroke-linejoin="round"/><text x="142" y="100" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">YaVaKa</text><text x="144" y="124" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BUILD FROM ANYWHERE</text><rect x="74" y="157" width="351" height="42" rx="21.0" fill="#fffdf8" opacity="0.1"/><circle cx="99" cy="178.0" r="5" fill="#e2b967"/><text x="118" y="183.4" fill="#f3e6cb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">REAL TIME · FROM ANYWHERE</text><text x="72" y="322" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-1.5599999999999998">You're not waiting</text><text x="72" y="396.4" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-1.5599999999999998">for a report.</text><text x="72" y="470.79999999999995" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-1.5599999999999998">You're watching.</text><text x="76" y="561.1999999999999" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Every approval, payment, receipt and stage update is written to the</text><text x="76" y="591.1999999999999" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">ledger the moment it happens. Open it from any time zone, any hour.</text><text x="76" y="631.1999999999999" fill="#e2b967" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Logged as it happens, not reconstructed from memory a month later.</text><rect x="66" y="690" width="948" height="292" rx="30" fill="#ffffff" opacity="0.07"/><rect x="66" y="690" width="948" height="292" rx="30" fill="none" stroke="#fffdf8" stroke-width="1" opacity="0.16"/><path d="M66 926h948" stroke="#fffdf8" stroke-opacity=".13"/><path d="M66 956c161-61 287-31 427-20 152 13 294-27 521-81v103H66Z" fill="#07231f" opacity=".82"/><rect x="102" y="712" width="364" height="68" rx="16" fill="#fffdf8"/><circle cx="141" cy="746.0" r="19" fill="#e7f0eb"/><g transform="translate(129 734.0)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.3 4.3L19 7.4"/></g><text x="176" y="742" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">PAYMENTS</text><text x="176" y="764" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Approved by us, or paid</text><rect x="102" y="790" width="364" height="68" rx="16" fill="#fffdf8"/><circle cx="141" cy="824.0" r="19" fill="#f5ebd6"/><g transform="translate(129 812.0)" fill="none" stroke="#a97926" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.2h14v17.6l-3.5-2-3.5 2-3.5-2L5 20.8Z"/><path d="M8.6 8.4h6.8M8.6 12.2h6.8"/></g><text x="176" y="820" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">RECEIPTS</text><text x="176" y="842" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Attached to the cost</text><rect x="102" y="868" width="364" height="68" rx="16" fill="#fffdf8"/><circle cx="141" cy="902.0" r="19" fill="#f5ebd6"/><g transform="translate(129 890.0)" fill="none" stroke="#a97926" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.4v5l3.4 2"/></g><text x="176" y="898" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">TIMESTAMPS</text><text x="176" y="920" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Dated, never backfilled</text><path d="M1080 690 H670 Q640 690 640 720 V952 Q640 982 670 982 H1080 Z" fill="#fffdf8" stroke="#c8963e" stroke-width="3.5"/><circle cx="698" cy="758" r="23" fill="#f2e6cd"/><g transform="translate(686 746)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="736" y="752" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" letter-spacing="0.8">ALL ACCOUNTABLE.</text><text x="736" y="776" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" letter-spacing="0.8">ALL TRACEABLE.</text><text x="682" y="836" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">You get automated WhatsApp</text><text x="682" y="862" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">and email notifications — and</text><text x="682" y="888" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">you can see every receipt,</text><text x="682" y="914" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">invoice and document, at every</text><text x="682" y="940" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">stage, in your YaVaKa portal.</text><text x="72" y="1062" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" font-style="italic">“No one has to tell you how the build is going.”</text><rect x="72" y="1094" width="255" height="66" rx="18" fill="#c8963e"/><text x="102" y="1134.0" fill="#142f27" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">SEE IT LIVE</text><path d="M265 1127.0h25m-9-9 9 9-9 9" fill="none" stroke="#142f27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">REAL TIME · ANY TIME ZONE</text>
</svg>
