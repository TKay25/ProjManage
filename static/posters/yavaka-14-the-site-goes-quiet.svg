<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">The site goes quiet the day you fly back.</title>
  <desc id="desc">Work can slow once a diaspora client leaves the country. YaVaKa keeps site supervision constant and recorded.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#07231f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#sky)"/><circle cx="944" cy="102" r="176" fill="#c8963e" opacity=".09"/><path d="M0 627c172-84 305-89 476-43s347 28 604-71v310H0Z" fill="#0b4035" opacity=".85"/><path d="M0 716c190-84 355-67 526-34s348 13 554-82v192H0Z" fill="#07231f"/><g fill="none" stroke="#d8b36d" stroke-opacity=".22"><path d="M-20 230c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/><path d="M-20 249c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/></g><rect x="72" y="62" width="54" height="54" rx="12.66" fill="#0F5D46"/><path d="M82.12 89.0 L99.0 74.66 L115.88 89.0" fill="none" stroke="#F7F4EF" stroke-width="3.54" stroke-linecap="round" stroke-linejoin="round"/><rect x="86.34" y="90.69" width="4.64" height="12.66" rx="2.02" fill="#C8963E"/><rect x="94.36" y="86.47" width="4.64" height="16.88" rx="2.02" fill="#E3B968"/><rect x="102.38" y="82.25" width="4.64" height="21.09" rx="2.02" fill="#C8963E"/><text x="142" y="100" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">YaVaKa</text><text x="144" y="124" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BUILD FROM ANYWHERE</text><rect x="74" y="157" width="452" height="42" rx="21.0" fill="#fffdf8" opacity="0.1"/><circle cx="99" cy="178.0" r="5" fill="#e2b967"/><text x="118" y="183.4" fill="#f3e6cb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">THE PATTERN NOBODY WARNS YOU ABOUT</text><circle cx="880" cy="352" r="250" fill="#c8963e" opacity=".05"/><text x="72" y="322" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-1.5599999999999998">The site goes quiet</text><text x="72" y="396.4" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-1.5599999999999998">the day you</text><text x="72" y="470.79999999999995" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-1.5599999999999998">fly back.</text><text x="76" y="561.1999999999999" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Two weeks of visible progress while you are in the country. Then the</text><text x="76" y="591.1999999999999" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">photos stop, the labour drops, and the excuses begin.</text><text x="76" y="631.1999999999999" fill="#e2b967" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Our presence does not depend on your flight schedule.</text><rect x="66" y="690" width="948" height="292" rx="30" fill="#ffffff" opacity="0.07"/><rect x="66" y="690" width="948" height="292" rx="30" fill="none" stroke="#fffdf8" stroke-width="1" opacity="0.16"/><path d="M66 926h948" stroke="#fffdf8" stroke-opacity=".13"/><path d="M66 956c161-61 287-31 427-20 152 13 294-27 521-81v103H66Z" fill="#07231f" opacity=".82"/><rect x="102" y="712" width="364" height="68" rx="16" fill="#fffdf8"/><circle cx="141" cy="746.0" r="19" fill="#e7f0eb"/><g transform="translate(129 734.0)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M3.8 12h16.4M12 3.8c3 3.6 3 12.8 0 16.4-3-3.6-3-12.8 0-16.4Z"/></g><text x="176" y="742" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">PRESENCE</text><text x="176" y="764" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">On site whether you are</text><rect x="102" y="790" width="364" height="68" rx="16" fill="#fffdf8"/><circle cx="141" cy="824.0" r="19" fill="#f5ebd6"/><g transform="translate(129 812.0)" fill="none" stroke="#a97926" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.4" r="4"/><path d="M8.4 7l1.6-2.6h4L15.6 7"/></g><text x="176" y="820" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">EVIDENCE</text><text x="176" y="842" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Dated photos per stage</text><rect x="102" y="868" width="364" height="68" rx="16" fill="#fffdf8"/><circle cx="141" cy="902.0" r="19" fill="#f5ebd6"/><g transform="translate(129 890.0)" fill="none" stroke="#a97926" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.4v5l3.4 2"/></g><text x="176" y="898" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">RHYTHM</text><text x="176" y="920" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">The programme checked</text><path d="M1080 690 H670 Q640 690 640 720 V952 Q640 982 670 982 H1080 Z" fill="#fffdf8" stroke="#c8963e" stroke-width="3.5"/><circle cx="696" cy="783.0" r="23" fill="#f2e6cd"/><g transform="translate(684 771.0)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="732" y="767.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL ACCOUNTABLE.</text><text x="732" y="789.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL TRACEABLE.</text><text x="732" y="811.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL SECURE.</text><text x="682" y="853.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Automated WhatsApp and email notifications.</text><text x="682" y="879.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Every receipt, invoice and document — at every</text><text x="682" y="905.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">stage — in your YaVaKa portal. Private to your</text><text x="682" y="931.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">build team and encrypted in transit.</text><text x="72" y="1062" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" font-style="italic">“Progress should not need a boarding pass.”</text><rect x="72" y="1094" width="372" height="66" rx="18" fill="#c8963e"/><text x="102" y="1134.0" fill="#142f27" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">KEEP THE SITE MOVING</text><path d="M382 1127.0h25m-9-9 9 9-9 9" fill="none" stroke="#142f27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">WE DON'T FLY HOME. WE LIVE HERE.</text>
</svg>
