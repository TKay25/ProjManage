<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">A Zimbabwean company built for Zimbabweans abroad.</title>
  <desc id="desc">YaVaKa is an independent build management and delivery company: we supervise, we record, and where the client prefers, we build.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#07231f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1080" height="1350" fill="#f7f4ef"/><rect x="0" y="0" width="1080" height="742" fill="#0c3b31"/><circle cx="944" cy="96" r="180" fill="#c8963e" opacity=".09"/><path d="M0 622c190-54 352-26 527 6s367-8 553-66v180H0Z" fill="#07231f"/><g fill="none" stroke="#d8b36d" stroke-opacity=".2"><path d="M-20 214c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/></g><rect x="72" y="62" width="54" height="54" rx="12.66" fill="#0F5D46"/><path d="M82.12 89.0 L99.0 74.66 L115.88 89.0" fill="none" stroke="#F7F4EF" stroke-width="3.54" stroke-linecap="round" stroke-linejoin="round"/><rect x="86.34" y="90.69" width="4.64" height="12.66" rx="2.02" fill="#C8963E"/><rect x="94.36" y="86.47" width="4.64" height="16.88" rx="2.02" fill="#E3B968"/><rect x="102.38" y="82.25" width="4.64" height="21.09" rx="2.02" fill="#C8963E"/><text x="142" y="100" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">YaVaKa</text><text x="144" y="124" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BUILD FROM ANYWHERE</text><rect x="74" y="152" width="194" height="42" rx="21.0" fill="#fffdf8" opacity="0.1"/><circle cx="99" cy="173.0" r="5" fill="#e2b967"/><text x="118" y="178.4" fill="#f3e6cb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">THE COMPANY</text><g opacity=".5" transform="translate(96 426) scale(.82)"><path d="M622 192 779 89l156 103" fill="none" stroke="#fffdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M666 182v107h225V182M741 289v-69h75v69" fill="#fffdf8" fill-opacity=".1" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"/><path d="M688 211h26v29h-26zM850 211h25v29h-25z" fill="#e2b967" opacity=".86"/><path d="M580 290h365" stroke="#e2b967" stroke-width="6" stroke-linecap="round"/><path d="M602 313h321" stroke="#fffdf8" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/></g><text x="72" y="300" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="-1.508">Zimbabwean built.</text><text x="72" y="371.92" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="-1.508">For those abroad.</text><text x="76" y="451.84000000000003" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">We are not an app pretending to be a builder, and not a builder</text><text x="76" y="481.84000000000003" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">pretending to be independent. The record and the site are the</text><text x="76" y="511.84000000000003" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">same business, which is why the record can be trusted.</text><path d="M72 808h560" stroke="#c8963e" stroke-width="3" stroke-linecap="round"/><text x="72" y="776" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">What we stand on</text><text x="72" y="854" fill="#a97926" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">01</text><text x="120" y="854" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Independence</text><text x="120" y="880" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Paid by the client, never by the contractor</text><text x="72" y="928" fill="#a97926" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">02</text><text x="120" y="928" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Evidence</text><text x="120" y="954" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Every stage and payment carries proof</text><text x="72" y="1002" fill="#a97926" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">03</text><text x="120" y="1002" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Presence</text><text x="120" y="1028" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">People on the ground, all year</text><path d="M1080 754 H690 Q660 754 660 784 V1016 Q660 1046 690 1046 H1080 Z" fill="#fffdf8" stroke="#c8963e" stroke-width="3.5"/><circle cx="716" cy="847.0" r="23" fill="#f2e6cd"/><g transform="translate(704 835.0)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="752" y="831.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL ACCOUNTABLE.</text><text x="752" y="853.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL TRACEABLE.</text><text x="752" y="875.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL SECURE.</text><text x="702" y="917.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Automated WhatsApp and email notifications.</text><text x="702" y="943.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Every receipt, invoice and document — at every</text><text x="702" y="969.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">stage — in your YaVaKa portal. Private to your</text><text x="702" y="995.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">build team and encrypted in transit.</text><rect x="72" y="1094" width="268" height="66" rx="18" fill="#c8963e"/><text x="102" y="1134.0" fill="#142f27" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">WORK WITH US</text><path d="M278 1127.0h25m-9-9 9 9-9 9" fill="none" stroke="#142f27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">INDEPENDENT BUILD MANAGEMENT.</text>
</svg>
