    <text x="72" y="62" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2.2">BUILD FROM ANYWHERE</text>
  </g>
  <g transform="translate(72 157)">
    <rect width="324" height="42" rx="21" fill="#fffdf8" opacity=".1"/>
    <circle cx="22" cy="21" r="5" fill="#d7ad61"/>
    <text x="41" y="27" fill="#f3e6cb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">YAVAKA-MANAGED BUILDS</text>
  </g>
  <text x="72" y="286" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="65" font-weight="700" letter-spacing="-1.6">
    <tspan x="72" dy="0">On site in</tspan>
    <tspan x="72" dy="79" fill="#e2b967">Zimbabwe.</tspan>
  </text>
  <text x="76" y="433" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="51" font-style="italic">You, in the picture.</text>
  <text x="76" y="493" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="76" dy="0">When YaVaKa manages your build, we coordinate the people,</tspan>
    <tspan x="76" dy="32">chase the site and record what actually happened.</tspan>
  </text>

  <g transform="translate(58 571)">
    <rect width="964" height="340" rx="30" fill="#fffdf8" opacity=".08" stroke="#fffdf8" stroke-opacity=".18"/>
    <path d="M0 254h964" stroke="#fffdf8" stroke-opacity=".12"/>
    <path d="m66 238 157-137 159 137v38H66Z" fill="#e9dfcf"/>
    <path d="m42 243 181-157 184 157" fill="none" stroke="#fffdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
