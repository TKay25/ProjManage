<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">On site in Zimbabwe. You, in the picture.</title>
  <desc id="desc">When YaVaKa manages a build it coordinates builders, follows up on site and records project payments, progress and receipts.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143f35"/>
      <stop offset="1" stop-color="#082e29"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8963e"/>
      <stop offset="1" stop-color="#e0b45e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#night)"/>
  <circle cx="874" cy="307" r="160" fill="#c8963e" opacity=".14"/>
  <path d="M0 590c190-40 333-58 516-12s365 51 564-28v239H0Z" fill="#124637"/>
