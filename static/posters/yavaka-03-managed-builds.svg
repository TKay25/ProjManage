      <path d="m22 17 5 5 10-11" fill="none" stroke="#183e32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="60" y="0" width="388" height="74" rx="17" fill="#fffdf8"/>
      <text x="84" y="29" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">COORDINATION</text>
      <text x="84" y="54" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="16">Builders and suppliers, one team</text>
    </g>
    <g transform="translate(470 153)">
      <circle cx="29" cy="17" r="16" fill="#e0b45e"/>
      <path d="m22 17 5 5 10-11" fill="none" stroke="#183e32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="60" y="0" width="388" height="74" rx="17" fill="#fffdf8"/>
      <text x="84" y="29" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">BUILDER FOLLOW-UP</text>
      <text x="84" y="54" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="16">Chased on site, not assumed</text>
    </g>
    <g transform="translate(470 244)">
      <circle cx="29" cy="17" r="16" fill="#e0b45e"/>
      <path d="m22 17 5 5 10-11" fill="none" stroke="#183e32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="60" y="0" width="388" height="74" rx="17" fill="#fffdf8"/>
      <text x="84" y="29" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">PAYMENTS + PROOF</text>
      <text x="84" y="54" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="16">Paid, receipted, filed</text>
    </g>
  </g>

  <g transform="translate(72 980)">
    <text x="0" y="0" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700">A manager who answers.</text>
    <text x="0" y="47" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="22">A record that answers too.</text>
    <text x="0" y="105" fill="#8a672c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">FROM STAND CHECKS TO HANDOVER</text>
    <path d="M0 135h936" stroke="#d8d0c3" stroke-width="2"/>
    <text x="0" y="191" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic">“You’re not funding a build. You’re building it—from here.”</text>
    <rect x="0" y="223" width="414" height="72" rx="18" fill="#0f5d46"/>
    <text x="28" y="269" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">START A MANAGED BUILD</text>
    <path d="M360 258h25m-9-9 9 9-9 9" fill="none" stroke="#e2b967" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="343" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="18">yavaka.onrender.com</text>
    <text x="1008" y="343" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" letter-spacing="2">FROM STAND CHECKS TO HANDOVER.</text>
  </g>
