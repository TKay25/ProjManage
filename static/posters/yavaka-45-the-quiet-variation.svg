 stroke-width="3"/><text x="128" y="424" fill="#8fa79b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">Measure</text><circle cx="98" cy="514" r="10" fill="#0c3b31" stroke="#e2b967" stroke-opacity="1" stroke-width="3"/><text x="128" y="520" fill="#8fa79b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">Price</text><circle cx="98" cy="610" r="17" fill="#c8963e" stroke="#e2b967" stroke-opacity="1" stroke-width="3"/><text x="128" y="616" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">Approve</text><circle cx="98" cy="706" r="10" fill="#0e2f28" stroke="#fffdf8" stroke-opacity="0.28" stroke-width="3"/><text x="128" y="712" fill="#8fa79b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">Build</text><circle cx="98" cy="802" r="10" fill="#0e2f28" stroke="#fffdf8" stroke-opacity="0.28" stroke-width="3"/><text x="128" y="808" fill="#8fa79b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">Settle</text><text x="288" y="328" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-1.196">No verbal extras.</text><text x="288" y="383.2" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-1.196">No surprise invoice.</text><text x="288" y="454.4" fill="#c3d2c9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A variation on a phone call is a favour, and favours have no cap.</text><text x="288" y="481.4" fill="#c3d2c9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Written and priced first, then built, then paid.</text><rect x="72" y="876" width="936" height="146" rx="26" fill="#ffffff" opacity="0.06"/><rect x="72" y="876" width="936" height="146" rx="26" fill="none" stroke="#fffdf8" stroke-width="1" opacity="0.16"/><circle cx="134" cy="949" r="24" fill="#c8963e" opacity=".16"/><g transform="translate(122 937)" fill="none" stroke="#e2b967" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="182" y="936" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">WRITTEN AND APPROVED</text><text x="182" y="968" fill="#c3d2c9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Priced before it is built, not after.</text><text x="76" y="1090" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" font-style="italic">“A change you did not price is a price you did not choose.”</text><rect x="72" y="1130" width="346" height="66" rx="18" fill="#c8963e"/><text x="102" y="1170.0" fill="#142f27" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">PRICE EVERY CHANGE</text><path d="M356 1163.0h25m-9-9 9 9-9 9" fill="none" stroke="#142f27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">NOTHING CHANGES FOR FREE.</text>
</svg>
