<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">The expensive change is the one nobody wrote down.</title>
  <desc id="desc">Every variation on a YaVaKa build is written, priced and approved before the work happens.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
