<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Verify the business. Get the quote in writing. Record it against the stage.</title>
  <desc id="desc">YaVaKa verifies suppliers, requires written quotes and records every invoice against the build stage it serves.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#07231f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1080" height="1350" fill="#f7f4ef"/><rect x="0" y="0" width="1080" height="742" fill="#0c3b31"/><circle cx="944" cy="96" r="180" fill="#c8963e" opacity=".09"/><path d="M0 622c190-54 352-26 527 6s367-8 553-66v180H0Z" fill="#07231f"/><g fill="none" stroke="#d8b36d" stroke-opacity=".2"><path d="M-20 214c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/></g><rect x="72" y="62" width="54" height="54" rx="14" fill="#0f5d46"/><path d="m83 90 16-14 16 14" fill="none" stroke="#fffdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 92v13h22V92M94 105V94h9v11" fill="none" stroke="#c8963e" stroke-width="3" stroke-linejoin="round"/><text x="142" y="100" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">YaVaKa</text><text x="144" y="124" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BUILD FROM ANYWHERE</text><rect x="74" y="152" width="452" height="42" rx="21.0" fill="#fffdf8" opacity="0.1"/><circle cx="99" cy="173.0" r="5" fill="#e2b967"/><text x="118" y="178.4" fill="#f3e6cb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">THREE HABITS THAT PREVENT DISASTER</text><g opacity=".5" transform="translate(96 426) scale(.82)"><path d="M622 192 779 89l156 103" fill="none" stroke="#fffdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M666 182v107h225V182M741 289v-69h75v69" fill="#fffdf8" fill-opacity=".1" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"/><path d="M688 211h26v29h-26zM850 211h25v29h-25z" fill="#e2b967" opacity=".86"/><path d="M580 290h365" stroke="#e2b967" stroke-width="6" stroke-linecap="round"/><path d="M602 313h321" stroke="#fffdf8" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/></g><text x="72" y="300" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="-1.508">Verify. Quote.</text><text x="72" y="371.92" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="-1.508">Record. Repeat.</text><text x="76" y="451.84000000000003" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Three unglamorous habits separate a finished build from a six-year</text><text x="76" y="481.84000000000003" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">argument. We apply all three. Even when it is boring.</text><path d="M72 808h560" stroke="#c8963e" stroke-width="3" stroke-linecap="round"/><text x="72" y="776" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Applied to every supplier</text><text x="72" y="854" fill="#a97926" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">01</text><text x="120" y="854" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Verify the business</text><text x="120" y="880" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Registered, contactable, and able to show delivered work</text><text x="72" y="928" fill="#a97926" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">02</text><text x="120" y="928" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Get a written quote</text><text x="120" y="954" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Scope, quantity, price and lead time, in writing</text><text x="72" y="1002" fill="#a97926" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">03</text><text x="120" y="1002" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Record the invoice</text><text x="120" y="1028" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Filed against the exact stage it was bought for</text><path d="M1080 754 H690 Q660 754 660 784 V1016 Q660 1046 690 1046 H1080 Z" fill="#fffdf8" stroke="#c8963e" stroke-width="3.5"/><circle cx="718" cy="822" r="23" fill="#f2e6cd"/><g transform="translate(706 810)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="756" y="816" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" letter-spacing="0.8">ALL ACCOUNTABLE.</text><text x="756" y="840" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" letter-spacing="0.8">ALL TRACEABLE.</text><text x="702" y="900" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">You get automated WhatsApp</text><text x="702" y="926" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">and email notifications — and</text><text x="702" y="952" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">you can see every receipt,</text><text x="702" y="978" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">invoice and document, at every</text><text x="702" y="1004" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">stage, in your YaVaKa portal.</text><rect x="72" y="1094" width="372" height="66" rx="18" fill="#c8963e"/><text x="102" y="1134.0" fill="#142f27" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">BUILD ON PAPER FIRST</text><path d="M382 1127.0h25m-9-9 9 9-9 9" fill="none" stroke="#142f27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">VERIFY. QUOTE. RECORD.</text>
</svg>
