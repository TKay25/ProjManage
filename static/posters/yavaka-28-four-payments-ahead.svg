<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">You are four payments ahead of the paperwork.</title>
  <desc id="desc">On a build already running, money often moves faster than evidence. The gap is where disputes live.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#07231f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#paper)"/><path d="M0 0h1080v196c-214 65-370 50-551 5S195 158 0 232Z" fill="#0f5d46"/><circle cx="956" cy="129" r="178" fill="#c8963e" opacity=".12"/><rect x="72" y="62" width="54" height="54" rx="12.66" fill="#0F5D46"/><path d="M82.12 89.0 L99.0 74.66 L115.88 89.0" fill="none" stroke="#F7F4EF" stroke-width="3.54" stroke-linecap="round" stroke-linejoin="round"/><rect x="86.34" y="90.69" width="4.64" height="12.66" rx="2.02" fill="#C8963E"/><rect x="94.36" y="86.47" width="4.64" height="16.88" rx="2.02" fill="#E3B968"/><rect x="102.38" y="82.25" width="4.64" height="21.09" rx="2.02" fill="#C8963E"/><text x="142" y="100" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">YaVaKa</text><text x="144" y="124" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BUILD FROM ANYWHERE</text><text x="78" y="152" fill="#e2b967" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">THE MID-BUILD TRAP</text><text x="58" y="432" fill="#c8963e" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="700" opacity="0.16">“</text><text x="76" y="466" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="49" font-weight="700" letter-spacing="-1.274">“You are four</text><text x="76" y="524.8" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="49" font-weight="700" letter-spacing="-1.274">payments ahead</text><text x="76" y="583.5999999999999" fill="#a97926" font-family="Georgia, 'Times New Roman', serif" font-size="49" font-weight="700" letter-spacing="-1.274">of the paperwork.”</text><path d="M1080 452 H590 Q560 452 560 482 V714 Q560 744 590 744 H1080 Z" fill="#fffdf8" stroke="#c8963e" stroke-width="3.5"/><circle cx="616" cy="545.0" r="23" fill="#f2e6cd"/><g transform="translate(604 533.0)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="652" y="529.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL ACCOUNTABLE.</text><text x="652" y="551.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL TRACEABLE.</text><text x="652" y="573.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL SECURE.</text><text x="602" y="615.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Automated WhatsApp and email notifications.</text><text x="602" y="641.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Every receipt, invoice and document — at every</text><text x="602" y="667.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">stage — in your YaVaKa portal. Private to your</text><text x="602" y="693.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">build team and encrypted in transit.</text><path d="M76 790h120" stroke="#c8963e" stroke-width="3" stroke-linecap="round"/><text x="76" y="830" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="1.2">HOW A RUNNING BUILD STARTS TO SLIP</text><text x="76" y="870" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">It rarely starts with a fraud. It starts with trust, speed and a</text><text x="76" y="898" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">receipt promised for next week. Six weeks later nobody can</text><text x="76" y="926" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">reconstruct what was paid for what.</text><rect x="72" y="948" width="936" height="88" rx="20" fill="#fffdf8" stroke="#e2d9ca" stroke-width="1"/><circle cx="116" cy="990" r="20" fill="#f5ebd6"/><g transform="translate(104 978)" fill="none" stroke="#a97926" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.2h14v17.6l-3.5-2-3.5 2-3.5-2L5 20.8Z"/><path d="M8.6 8.4h6.8M8.6 12.2h6.8"/></g><text x="154" y="972" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Stop the drift</text><text x="154" y="998" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Evidence before the next release</text><rect x="72" y="1094" width="281" height="66" rx="18" fill="#0f5d46"/><text x="102" y="1134.0" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">CLOSE THE GAP</text><path d="M291 1127.0h25m-9-9 9 9-9 9" fill="none" stroke="#e2b967" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">EVIDENCE BEFORE THE NEXT RELEASE.</text>
</svg>
