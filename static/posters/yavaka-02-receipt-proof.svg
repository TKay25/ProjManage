<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Tranche two cleared. Then the site went quiet.</title>
  <desc id="desc">The money problem on a diaspora build: no invoices, no receipts, no way to see what the money touched. YaVaKa requires proof before any payment.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#paper)"/>
  <path d="M0 0h1080v208c-214 65-370 50-551 5S195 170 0 244Z" fill="#0f5d46"/>
  <circle cx="956" cy="139" r="182" fill="#c8963e" opacity=".12"/>
  <g transform="translate(72 62)">
    <rect width="54" height="54" rx="14" fill="#fffdf8" opacity=".12"/>
    <path d="m11 28 16-14 16 14" fill="none" stroke="#f7f4ef" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 30v13h22V30M22 43V32h9v11" fill="none" stroke="#c8963e" stroke-width="3" stroke-linejoin="round"/>
    <text x="70" y="38" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">YaVaKa</text>
    <text x="72" y="62" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2.2">BUILD FROM ANYWHERE</text>
  </g>
  <text x="72" y="252" fill="#a97926" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">THE MONEY PROBLEM</text>
  <text x="72" y="330" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="57" font-weight="700" letter-spacing="-1.5">
    <tspan x="72" dy="0">Tranche two cleared.</tspan>
    <tspan x="72" dy="70">Then the site</tspan>
    <tspan x="72" dy="70" fill="#a97926">went quiet.</tspan>
  </text>
  <text x="77" y="543" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic">“I stopped asking for photos of the receipt. I could see it.”</text>
  <text x="77" y="592" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="77" dy="0">No invoices. No receipts. No way to know</tspan>
    <tspan x="77" dy="32">what your money actually touched.</tspan>
  </text>

  <g filter="url(#shadow)" transform="translate(136 704)">
    <rect width="808" height="410" rx="32" fill="#fffdf8"/>
    <path d="M0 104h808" stroke="#e8e1d5" stroke-width="2"/>
    <text x="42" y="54" fill="#718076" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">PROJECT MONEY · GREENDALE FAMILY HOME</text>
    <text x="42" y="91" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">No proof. No payment.</text>
    <rect x="42" y="132" width="724" height="108" rx="20" fill="#edf3ee"/>
    <text x="70" y="169" fill="#62756a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">AVAILABLE BALANCE</text>
    <text x="70" y="216" fill="#0f5d46" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">$18,420.00</text>
    <rect x="626" y="164" width="102" height="42" rx="21" fill="#d8eadf"/>
    <text x="677" y="191" fill="#0f5d46" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">LIVE</text>
    <g transform="translate(45 274)">
      <circle cx="24" cy="24" r="22" fill="#f5ebd6"/>
      <path d="M17 25h14M24 18v14" stroke="#a97926" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="20" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Roofing materials</text>
      <text x="62" y="45" fill="#738076" font-family="Arial, Helvetica, sans-serif" font-size="15">Expense · Superstructure</text>
      <text x="682" y="29" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end">−$1,240</text>
      <rect x="604" y="45" width="111" height="28" rx="14" fill="#e8f2eb"/>
      <path d="m620 59 5 5 9-11" fill="none" stroke="#0f5d46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="675" y="64" fill="#0f5d46" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">RECEIPT</text>
    </g>
    <path d="M42 364h724" stroke="#e8e1d5" stroke-width="2"/>
    <text x="45" y="394" fill="#64736a" font-family="Arial, Helvetica, sans-serif" font-size="14">Approved or paid by us. You see it live, from anywhere.</text>
    <path d="M722 379v18m-9-9 9 9 9-9" fill="none" stroke="#c8963e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(72 1171)">
    <text x="0" y="0" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic">“The money finished” is not an answer. It's a question.</text>
    <rect x="0" y="29" width="374" height="70" rx="18" fill="#0f5d46"/>
    <text x="28" y="73" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">FOLLOW THE MONEY</text>
    <path d="M325 64h22m-8-8 8 8-8 8" fill="none" stroke="#e2b967" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="143" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="18">yavaka.onrender.com</text>
    <text x="936" y="143" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" letter-spacing="2">NO PROOF. NO PAYMENT.</text>
  </g>
</svg>
