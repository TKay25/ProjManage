<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Most builds go wrong before the first brick is laid.</title>
  <desc id="desc">Budget, programme, approvals and a signed scope are all set before work starts on a YaVaKa-managed build.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#07231f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#sky)"/><circle cx="944" cy="102" r="176" fill="#c8963e" opacity=".09"/><path d="M0 627c172-84 305-89 476-43s347 28 604-71v310H0Z" fill="#0b4035" opacity=".85"/><path d="M0 716c190-84 355-67 526-34s348 13 554-82v192H0Z" fill="#07231f"/><g fill="none" stroke="#d8b36d" stroke-opacity=".22"><path d="M-20 230c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/><path d="M-20 249c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/></g><circle cx="150" cy="330" r="230" fill="#c8963e" opacity=".06"/><rect x="72" y="62" width="54" height="54" rx="12.66" fill="#0F5D46"/><path d="M82.12 89.0 L99.0 74.66 L115.88 89.0" fill="none" stroke="#F7F4EF" stroke-width="3.54" stroke-linecap="round" stroke-linejoin="round"/><rect x="86.34" y="90.69" width="4.64" height="12.66" rx="2.02" fill="#C8963E"/><rect x="94.36" y="86.47" width="4.64" height="16.88" rx="2.02" fill="#E3B968"/><rect x="102.38" y="82.25" width="4.64" height="21.09" rx="2.02" fill="#C8963E"/><text x="142" y="100" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">YaVaKa</text><text x="144" y="124" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BUILD FROM ANYWHERE</text><rect x="74" y="157" width="261" height="42" rx="21.0" fill="#fffdf8" opacity="0.1"/><circle cx="99" cy="178.0" r="5" fill="#e2b967"/><text x="118" y="183.4" fill="#f3e6cb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">STARTING TOMORROW</text><text x="72" y="306" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="-1.456">The build is decided</text><text x="72" y="375.44" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="-1.456">before it starts.</text><text x="76" y="454.88" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Scope, price, programme and approvals all exist up front.</text><text x="76" y="484.88" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Changing them afterwards is where the money disappears.</text><path d="M98 646h884" stroke="#fffdf8" stroke-opacity=".16" stroke-width="4"/><path d="M98 646h176.8" stroke="#e2b967" stroke-width="4"/><circle cx="98.0" cy="646" r="13" fill="#0c3b31" stroke="#e2b967" stroke-opacity="1" stroke-width="3"/><circle cx="98.0" cy="646" r="5" fill="#e2b967"/><text x="98.0" y="708" fill="#9fb3a8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">Scope</text><circle cx="274.8" cy="646" r="19" fill="#c8963e" stroke="#e2b967" stroke-opacity="1" stroke-width="3"/><text x="274.8" y="708" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" text-anchor="middle">Price</text><circle cx="451.6" cy="646" r="13" fill="#0e2f28" stroke="#fffdf8" stroke-opacity="0.28" stroke-width="3"/><text x="451.6" y="708" fill="#9fb3a8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" text-anchor="middle">Approvals</text><circle cx="628.4000000000001" cy="646" r="13" fill="#0e2f28" stroke="#fffdf8" stroke-opacity="0.28" stroke-width="3"/><text x="628.4000000000001" y="708" fill="#9fb3a8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" text-anchor="middle">Mobilise</text><circle cx="805.2" cy="646" r="13" fill="#0e2f28" stroke="#fffdf8" stroke-opacity="0.28" stroke-width="3"/><text x="805.2" y="708" fill="#9fb3a8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" text-anchor="middle">Found</text><circle cx="982.0" cy="646" r="13" fill="#0e2f28" stroke="#fffdf8" stroke-opacity="0.28" stroke-width="3"/><text x="982.0" y="708" fill="#9fb3a8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" text-anchor="end">Build</text><rect x="72" y="790" width="936" height="152" rx="26" fill="#ffffff" opacity="0.06"/><rect x="72" y="790" width="936" height="152" rx="26" fill="none" stroke="#fffdf8" stroke-width="1" opacity="0.16"/><circle cx="134" cy="866" r="24" fill="#c8963e" opacity=".16"/><g transform="translate(122 854)" fill="none" stroke="#e2b967" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="182" y="852" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">PRICE AGAINST QUANTITIES</text><text x="182" y="886" fill="#c3d2c9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Measured work, market rates, nothing rounded.</text><text x="76" y="1040" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" font-style="italic">“Set it up properly once and the rest is just sequencing.”</text><rect x="72" y="1090" width="307" height="66" rx="18" fill="#c8963e"/><text x="102" y="1130.0" fill="#142f27" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">SET IT UP RIGHT</text><path d="M317 1123.0h25m-9-9 9 9-9 9" fill="none" stroke="#142f27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">DECIDED BEFORE DAY ONE.</text>
</svg>
