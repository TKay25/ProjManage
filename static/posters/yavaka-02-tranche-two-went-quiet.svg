<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Tranche two cleared. Then the site went quiet.</title>
  <desc id="desc">The common diaspora build failure: funds released without invoices, receipts or evidence of what the money touched.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#07231f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16372d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#paper)"/><path d="M0 0h1080v196c-214 65-370 50-551 5S195 158 0 232Z" fill="#0f5d46"/><circle cx="956" cy="129" r="178" fill="#c8963e" opacity=".12"/><rect x="72" y="62" width="54" height="54" rx="14" fill="#0f5d46"/><path d="m83 90 16-14 16 14" fill="none" stroke="#fffdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 92v13h22V92M94 105V94h9v11" fill="none" stroke="#c8963e" stroke-width="3" stroke-linejoin="round"/><text x="142" y="100" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">YaVaKa</text><text x="144" y="124" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BUILD FROM ANYWHERE</text><text x="78" y="152" fill="#e2b967" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">THE MONEY PROBLEM</text><text x="58" y="432" fill="#c8963e" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="700" opacity="0.16">“</text><text x="76" y="466" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="-1.0919999999999999">“Tranche two cleared.</text><text x="76" y="516.4" fill="#183e32" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="-1.0919999999999999">Then the site</text><text x="76" y="566.8" fill="#a97926" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="-1.0919999999999999">went quiet.”</text><path d="M1080 452 H590 Q560 452 560 482 V714 Q560 744 590 744 H1080 Z" fill="#fffdf8" stroke="#c8963e" stroke-width="3.5"/><circle cx="616" cy="545.0" r="23" fill="#f2e6cd"/><g transform="translate(604 533.0)" fill="none" stroke="#0f5d46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.8" y="10.2" width="14.4" height="10" rx="2.6"/><path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/></g><text x="652" y="529.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL ACCOUNTABLE.</text><text x="652" y="551.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL TRACEABLE.</text><text x="652" y="573.0" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8">ALL SECURE.</text><text x="602" y="615.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Automated WhatsApp and email notifications.</text><text x="602" y="641.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">Every receipt, invoice and document — at every</text><text x="602" y="667.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">stage — in your YaVaKa portal. Private to your</text><text x="602" y="693.0" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400">build team and encrypted in transit.</text><path d="M76 790h120" stroke="#c8963e" stroke-width="3" stroke-linecap="round"/><text x="76" y="830" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="1.2">THE MOST EXPENSIVE SILENCE IN CONSTRUCTION</text><text x="76" y="870" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">No invoices. No receipts. No way to know what your money touched.</text><text x="76" y="898" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">The next tranche should never leave before the last one is evidenced.</text><rect x="72" y="920" width="936" height="88" rx="20" fill="#fffdf8" stroke="#e2d9ca" stroke-width="1"/><circle cx="116" cy="962" r="20" fill="#f5ebd6"/><g transform="translate(104 950)" fill="none" stroke="#a97926" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.2h14v17.6l-3.5-2-3.5 2-3.5-2L5 20.8Z"/><path d="M8.6 8.4h6.8M8.6 12.2h6.8"/></g><text x="154" y="944" fill="#183e32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">No proof. No payment.</text><text x="154" y="970" fill="#526359" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Approved by us, or paid by us</text><rect x="72" y="1094" width="320" height="66" rx="18" fill="#0f5d46"/><text x="102" y="1134.0" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.4">FOLLOW THE MONEY</text><path d="M330 1127.0h25m-9-9 9 9-9 9" fill="none" stroke="#e2b967" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1272" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">yavaka.onrender.com</text><text x="1008" y="1272" fill="#65746a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1.9" text-anchor="end">NO PROOF. NO PAYMENT.</text>
</svg>
