<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">You can't be on site. We can.</title>
  <desc id="desc">YaVaKa independently manages a Zimbabwe build for a diaspora client: vetting the contractor, approving every payment and settling every dispute.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114f40"/>
      <stop offset="1" stop-color="#092f2a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fffdf8" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#sky)"/>
  <circle cx="944" cy="102" r="176" fill="#c8963e" opacity=".09"/>
  <path d="M0 627c172-84 305-89 476-43s347 28 604-71v310H0Z" fill="#0b4035" opacity=".85"/>
  <path d="M0 716c190-84 355-67 526-34s348 13 554-82v192H0Z" fill="#092f2a"/>
  <g fill="none" stroke="#d8b36d" stroke-opacity=".22">
    <path d="M-20 230c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/>
    <path d="M-20 249c145-91 289-94 424-3s284 87 435 4 253-82 387-15"/>
  </g>

  <g transform="translate(72 62)">
    <rect width="54" height="54" rx="14" fill="#0f5d46"/>
    <path d="m11 28 16-14 16 14" fill="none" stroke="#f7f4ef" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 30v13h22V30M22 43V32h9v11" fill="none" stroke="#c8963e" stroke-width="3" stroke-linejoin="round"/>
    <text x="70" y="38" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-.5">YaVaKa</text>
    <text x="72" y="62" fill="#d2ded7" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2.2">BUILD FROM ANYWHERE</text>
  </g>

  <g transform="translate(74 169)">
    <rect width="426" height="42" rx="21" fill="#fffdf8" opacity=".1"/>
    <circle cx="22" cy="21" r="5" fill="#d7ad61"/>
    <text x="41" y="27" fill="#f3e6cb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.7">THE DIASPORA BUILD PROBLEM</text>
  </g>
  <text x="72" y="322" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="-1.4">You can't be on site.</text>
  <text x="72" y="424" fill="#e2b967" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" letter-spacing="-2.4">We can.</text>
  <text x="76" y="486" fill="#d5e1da" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="76" dy="0">YaVaKa manages your build while your contractor does the work—</tspan>
    <tspan x="76" dy="31">vetting him, approving every payment or paying it ourselves,</tspan>
    <tspan x="76" dy="31">and settling the arguments.</tspan>
  </text>
  <text x="76" y="590" fill="#e2b967" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Everything is logged. You watch it live, from anywhere.</text>

  <g transform="translate(66 620)">
    <rect x="0" y="0" width="948" height="370" rx="30" fill="url(#glass)" stroke="#fffdf8" stroke-opacity=".16"/>
    <path d="M0 290h948" stroke="#fffdf8" stroke-opacity=".13"/>
    <path d="M0 324c161-61 287-31 427-20 152 13 294-27 521-81v147H0Z" fill="#072b27" opacity=".82"/>
    <circle cx="773" cy="82" r="41" fill="#c8963e" opacity=".18"/>
    <circle cx="773" cy="82" r="25" fill="#e0b45e" opacity=".75"/>
    <path d="M622 192 779 89l156 103" fill="none" stroke="#f7f4ef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M666 182v107h225V182M741 289v-69h75v69" fill="#f7f4ef" fill-opacity=".1" stroke="#f7f4ef" stroke-width="6" stroke-linejoin="round"/>
    <path d="M688 211h26v29h-26zM850 211h25v29h-25z" fill="#e0b45e" opacity=".86"/>
    <path d="M580 290h365" stroke="#c8963e" stroke-width="6" stroke-linecap="round"/>
    <path d="M602 313h321" stroke="#d8e1dc" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(36 46)">
      <rect width="364" height="90" rx="18" fill="#fffdf8"/>
      <circle cx="43" cy="45" r="21" fill="#e7f0eb"/>
      <path d="m34 45 7 7 13-15" fill="none" stroke="#0f5d46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="40" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1">VETTING</text>
      <text x="80" y="66" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="17">We choose the contractor</text>
    </g>
    <g transform="translate(36 153)">
      <rect width="364" height="90" rx="18" fill="#fffdf8"/>
      <circle cx="43" cy="45" r="21" fill="#f5ebd6"/>
      <rect x="32" y="37" width="23" height="16" rx="4" fill="none" stroke="#a97926" stroke-width="2.8"/>
      <path d="M32 43h23" stroke="#a97926" stroke-width="2.8"/>
      <circle cx="49.5" cy="49" r="1.6" fill="#a97926"/>
      <text x="80" y="40" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1">PAYMENTS</text>
      <text x="80" y="66" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="17">Approved—or paid—by us</text>
    </g>
    <g transform="translate(36 260)">
      <rect width="364" height="76" rx="18" fill="#fffdf8"/>
      <circle cx="43" cy="38" r="21" fill="#e7f0eb"/>
      <path d="M34 29h18a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-7l-6 5v-5h-5a4 4 0 0 1-4-4v-7a4 4 0 0 1 4-4Z" fill="none" stroke="#0f5d46" stroke-width="2.6" stroke-linejoin="round"/>
      <text x="80" y="34" fill="#193c31" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1">DISPUTES</text>
      <text x="80" y="59" fill="#58685e" font-family="Arial, Helvetica, sans-serif" font-size="17">We settle the arguments</text>
    </g>
  </g>

  <g transform="translate(72 1050)">
    <text x="0" y="0" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic">“You relax. We do the shouting.”</text>
    <rect x="0" y="40" width="390" height="72" rx="18" fill="#c8963e"/>
    <text x="30" y="86" fill="#142f27" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing=".4">GET A MANAGER ON SITE</text>
    <path d="M320 76h25m-9-9 9 9-9 9" fill="none" stroke="#142f27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="173" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="19">yavaka.onrender.com</text>
    <text x="936" y="173" fill="#d9e2dc" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" letter-spacing="2">WE MANAGE. WE BUILD. YOU RELAX.</text>
  </g>
</svg>
