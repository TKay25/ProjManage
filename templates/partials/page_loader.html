{# Page transition overlay. Rendered into every page so the logo markup lives in
   one place: nav.js only toggles it, and the roof/wall/base animation is driven
   by transitions.css. #}
<div class="page-progress" aria-hidden="true"></div>
<div class="page-loader" role="status" aria-live="polite" aria-label="Loading page">
  <div class="loader-mark">
    {{ logo_mark(56) }}
  </div>
  <p class="loader-text">Loading</p>
  <p class="loader-sub">{{ app_name }} · {{ app_tagline|lower }}</p>
</div>
