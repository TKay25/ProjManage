# Render blueprint for YaVaKa.
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repo.
# Postgres holds the relational data; the disk keeps uploaded receipts alive.
# A Free web service cannot mount a disk, so both are paid resources here.

services:
  - type: web
    name: vaka
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 8 --timeout 60 --access-logfile - wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set these in the dashboard; sync: false keeps them out of the repo.
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: SEED_DEMO
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: vaka-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_UPDATE_TEMPLATE
        sync: false
      - key: WHATSAPP_UPDATE_LANGUAGE
        value: en
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "1"
      - key: SMTP_USE_SSL
        value: "0"
      - key: NOTIFICATIONS_TOKEN
        sync: false
      - key: DIGEST_TOKEN
        sync: false
    disk:
      name: vaka-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: vaka-db
    plan: basic-256mb
    databaseName: vaka
    user: vaka
